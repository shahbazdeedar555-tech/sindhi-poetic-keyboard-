<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سنڌي شاعري ڪي بورڊ</title>

  <meta name="theme-color" content="#173d2b">
  <meta name="application-name" content="سنڌي شاعري ڪي بورڊ">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f1e8;
      color: #173d2b;
      font-family: Arial, sans-serif;
    }

    header {
      background: #173d2b;
      color: #f4d27a;
      text-align: center;
      padding: 14px 8px;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 12px;
    }

    /* لکڻي وارو حصو */

    #editor {
      width: 100%;
      min-height: 180px;
      border: 2px solid #b58b35;
      border-radius: 12px;
      padding: 14px;
      font-size: 25px;
      line-height: 1.9;
      direction: rtl;
      text-align: right;
      background: #fffdf7;
      color: #173d2b;
      outline: none;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }

    #editor:empty:before {
      content: "هتي سنڌي شاعري لکو...";
      color: #999;
      pointer-events: none;
    }

    /* ڊيزائن سيڪشن */

    .design-box {
      margin-top: 12px;
      padding: 10px;
      background: #fffaf0;
      border: 1px solid #b58b35;
      border-radius: 12px;
    }

    .design-title {
      text-align: center;
      color: #8a6722;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .design-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .design-row label {
      font-size: 16px;
      font-weight: bold;
      color: #173d2b;
    }

    select {
      height: 40px;
      border: 1px solid #b58b35;
      border-radius: 8px;
      background: #fffdf7;
      color: #173d2b;
      padding: 4px 8px;
      font-size: 16px;
      outline: none;
    }

    input[type="color"] {
      width: 48px;
      height: 40px;
      padding: 2px;
      border: 1px solid #b58b35;
      border-radius: 8px;
      background: #fffdf7;
    }

    .color-button {
      height: 40px;
      border: 1px solid #b58b35;
      border-radius: 8px;
      background: #ead9aa;
      color: #173d2b;
      padding: 5px 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .remove-color {
      background: #173d2b;
      color: white;
      border-color: #173d2b;
    }

    /* ڪي بورڊ */

    .keyboard {
      margin-top: 12px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin-bottom: 6px;
    }

    button {
      border: 1px solid #b58b35;
      background: #fffaf0;
      color: #173d2b;
      border-radius: 8px;
      min-width: 39px;
      height: 46px;
      padding: 3px 8px;
      font-size: 22px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      background: #e8d5a3;
      transform: scale(.96);
    }

    .special {
      background: #ead9aa;
      font-size: 21px;
    }

    .space {
      flex: 1;
      min-width: 150px;
      font-size: 19px;
    }

    .action {
      background: #173d2b;
      color: #fff;
      border-color: #173d2b;
      font-size: 18px;
    }

    .clear {
      background: #8b3a32;
      color: white;
      border-color: #8b3a32;
    }

    .title {
      text-align: center;
      margin: 12px 0 7px;
      color: #8a6722;
      font-size: 18px;
      font-weight: bold;
    }

    .english button {
      font-size: 19px;
      direction: ltr;
    }
  </style>
</head>

<body>

<header>سنڌي شاعري ڪي بورڊ</header>

<div class="container">

  <!-- لکڻي -->
  <div id="editor" contenteditable="true"></div>


  <!-- فانٽ ۽ ڪلر سليڪشن -->
  <div class="design-box">

    <div class="design-title">
      🖋️ فانٽ ۽ ڪلر سليڪشن
    </div>

    <div class="design-row">

      <label>فانٽ:</label>

      <select id="fontSelect" onchange="changeFont()">
        <option value="Arial">Arial</option>
        <option value="Noto Nastaliq Urdu">Noto Nastaliq Urdu</option>
        <option value="Jameel Noori Nastaleeq">Jameel Noori Nastaleeq</option>
        <option value="Noto Sans Arabic">Noto Sans Arabic</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Georgia">Georgia</option>
      </select>

      <label>سائيز:</label>

      <select id="sizeSelect" onchange="changeSize()">
        <option value="18px">18</option>
        <option value="20px">20</option>
        <option value="22px">22</option>
        <option value="24px">24</option>
        <option value="26px" selected>26</option>
        <option value="28px">28</option>
        <option value="30px">30</option>
        <option value="34px">34</option>
        <option value="38px">38</option>
        <option value="42px">42</option>
      </select>

    </div>


    <div class="design-row" style="margin-top:8px;">

      <label>چونڊيل لفظ جو رنگ:</label>

      <input
        type="color"
        id="textColor"
        value="#173d2b"
        onchange="changeSelectedColor()"
      >

      <button
        class="color-button remove-color"
        onclick="removeSelectedColor()">
        رنگ ختم
      </button>

    </div>

  </div>


  <div class="keyboard">

    <!-- خاص نشانيون -->

    <div class="title">خاص نشانيون</div>

    <div class="row">

      <button class="special" onclick="insertText('ـ')">ـ</button>
      <button class="special" onclick="insertText('َ')">َ</button>
      <button class="special" onclick="insertText('ِ')">ِ</button>
      <button class="special" onclick="insertText('ُ')">ُ</button>
      <button class="special" onclick="insertText('ْ')">ْ</button>
      <button class="special" onclick="insertText('ّ')">ّ</button>
      <button class="special" onclick="insertText('ٰ')">ٰ</button>

    </div>


    <!-- سنڌي اکر -->

    <div class="title">سنڌي اکر</div>

    <div class="row">

      <button onclick="insertText('ا')">ا</button>
      <button onclick="insertText('آ')">آ</button>
      <button onclick="insertText('ب')">ب</button>
      <button onclick="insertText('ٻ')">ٻ</button>
      <button onclick="insertText('پ')">پ</button>
      <button onclick="insertText('ڀ')">ڀ</button>
      <button onclick="insertText('ت')">ت</button>
      <button onclick="insertText('ٺ')">ٺ</button>
      <button onclick="insertText('ٽ')">ٽ</button>
      <button onclick="insertText('ث')">ث</button>
      <button onclick="insertText('ٿ')">ٿ</button>
      <button onclick="insertText('ڃ')">ڃ</button>
      <button onclick="insertText('ف')">ف</button>
      <button onclick="insertText('ڦ')">ڦ</button>
      <button onclick="insertText('گ')">گ</button>
      <button onclick="insertText('ڳ')">ڳ</button>
      <button onclick="insertText('ڱ')">ڱ</button>
      <button onclick="insertText('ک')">ک</button>
      <button onclick="insertText('ي')">ي</button>
      <button onclick="insertText('ى')">ى</button>
      <button onclick="insertText('د')">د</button>

    </div>


    <div class="row">

      <button onclick="insertText('ج')">ج</button>
      <button onclick="insertText('ڄ')">ڄ</button>
      <button onclick="insertText('جهه')">جهه</button>
      <button onclick="insertText('چ')">چ</button>
      <button onclick="insertText('ڇ')">ڇ</button>
      <button onclick="insertText('ح')">ح</button>
      <button onclick="insertText('خ')">خ</button>
      <button onclick="insertText('ر')">ر</button>
      <button onclick="insertText('ڙ')">ڙ</button>
      <button onclick="insertText('ز')">ز</button>
      <button onclick="insertText('س')">س</button>
      <button onclick="insertText('ش')">ش</button>
      <button onclick="insertText('ص')">ص</button>
      <button onclick="insertText('ض')">ض</button>

    </div>


    <div class="row">

      <button onclick="insertText('ط')">ط</button>
      <button onclick="insertText('ظ')">ظ</button>
      <button onclick="insertText('ع')">ع</button>
      <button onclick="insertText('غ')">غ</button>
      <button onclick="insertText('ل')">ل</button>
      <button onclick="insertText('م')">م</button>
      <button onclick="insertText('ن')">ن</button>
      <button onclick="insertText('و')">و</button>

      <button onclick="insertText('ه')">ه</button>
      <button onclick="insertText('ہ')">ہ</button>

      <button onclick="insertText('ء')">ء</button>
      <button onclick="insertText('ئ')">ئ</button>
      <button onclick="insertText('ے')">ے</button>
      <button onclick="insertText('ؤ')">ؤ</button>
      <button onclick="insertText('۾')">۾</button>
      <button onclick="insertText('۽')">۽</button>

      <button onclick="insertText('به')">به</button>
      <button onclick="insertText('بہ')">بہ</button>

    </div>


    <!-- Actions -->

    <div class="row">

      <button class="space" onclick="insertText(' ')">
        Space
      </button>

      <button class="action" onclick="backspace()">
        ⌫
      </button>

      <button class="action" onclick="insertText('\n')">
        Enter
      </button>

      <button class="clear" onclick="clearText()">
        صاف
      </button>

    </div>


    <!-- English -->

    <div class="title">English Keyboard</div>

    <div class="row english">

      <button onclick="insertText('q')">Q</button>
      <button onclick="insertText('w')">W</button>
      <button onclick="insertText('e')">E</button>
      <button onclick="insertText('r')">R</button>
      <button onclick="insertText('t')">T</button>
      <button onclick="insertText('y')">Y</button>
      <button onclick="insertText('u')">U</button>
      <button onclick="insertText('i')">I</button>
      <button onclick="insertText('o')">O</button>
      <button onclick="insertText('p')">P</button>

    </div>


    <div class="row english">

      <button onclick="insertText('a')">A</button>
      <button onclick="insertText('s')">S</button>
      <button onclick="insertText('d')">D</button>
      <button onclick="insertText('f')">F</button>
      <button onclick="insertText('g')">G</button>
      <button onclick="insertText('h')">H</button>
      <button onclick="insertText('j')">J</button>
      <button onclick="insertText('k')">K</button>
      <button onclick="insertText('l')">L</button>

    </div>


    <div class="row english">

      <button onclick="insertText('z')">Z</button>
      <button onclick="insertText('x')">X</button>
      <button onclick="insertText('c')">C</button>
      <button onclick="insertText('v')">V</button>
      <button onclick="insertText('b')">B</button>
      <button onclick="insertText('n')">N</button>
      <button onclick="insertText('m')">M</button>

    </div>

  </div>

</div>


<script>

const editor = document.getElementById("editor");

let savedRange = null;


/* -----------------------------
   Selection محفوظ ڪرڻ
----------------------------- */

function saveSelection() {

  const selection = window.getSelection();

  if (
    selection.rangeCount > 0 &&
    editor.contains(selection.anchorNode)
  ) {

    savedRange = selection.getRangeAt(0).cloneRange();

  }

}


/* -----------------------------
   Selection واپس آڻڻ
----------------------------- */

function restoreSelection() {

  if (!savedRange) return;

  const selection = window.getSelection();

  selection.removeAllRanges();

  selection.addRange(savedRange);

}


/* -----------------------------
   Editor اندر فوڪس
----------------------------- */

editor.addEventListener("keyup", saveSelection);

editor.addEventListener("mouseup", saveSelection);

editor.addEventListener("touchend", function() {

  setTimeout(saveSelection, 50);

});


/* -----------------------------
   Text داخل ڪرڻ
----------------------------- */

function insertText(text) {

  editor.focus();

  restoreSelection();

  const selection = window.getSelection();

  if (!selection.rangeCount) {

    const range = document.createRange();

    range.selectNodeContents(editor);

    range.collapse(false);

    selection.removeAllRanges();

    selection.addRange(range);

  }

  const range = selection.getRangeAt(0);

  range.deleteContents();

  const textNode = document.createTextNode(text);

  range.insertNode(textNode);

  range.setStartAfter(textNode);

  range.collapse(true);

  selection.removeAllRanges();

  selection.addRange(range);

  saveSelection();

}


/* -----------------------------
   Backspace
----------------------------- */

function backspace() {

  editor.focus();

  restoreSelection();

  const selection = window.getSelection();

  if (!selection.rangeCount) return;

  const range = selection.getRangeAt(0);

  if (!range.collapsed) {

    range.deleteContents();

    saveSelection();

    return;

  }

  let node = range.startContainer;

  let offset = range.startOffset;


  if (node.nodeType === Node.TEXT_NODE && offset > 0) {

    node.deleteData(offset - 1, 1);

    range.setStart(node, offset - 1);
    range.collapse(true);

  }

  else {

    const previous = node.childNodes[offset - 1];

    if (previous) {

      if (previous.nodeType === Node.TEXT_NODE) {

        if (previous.length > 0) {

          previous.deleteData(
            previous.length - 1,
            1
          );

        }

      }

      else {

        previous.remove();

      }

    }

  }

  saveSelection();

}


/* -----------------------------
   Clear
----------------------------- */

function clearText() {

  editor.innerHTML = "";

  editor.focus();

  savedRange = null;

}


/* -----------------------------
   چونڊيل لفظ جو رنگ
----------------------------- */

function changeSelectedColor() {

  editor.focus();

  restoreSelection();

  const selection = window.getSelection();

  if (!selection.rangeCount) return;

  const range = selection.getRangeAt(0);

  if (range.collapsed) {

    alert("پهريان لفظ يا جملو Select ڪريو.");

    return;

  }

  const color =
    document.getElementById("textColor").value;

  const span = document.createElement("span");

  span.style.color = color;

  try {

    range.surroundContents(span);

  } catch (error) {

    document.execCommand(
      "foreColor",
      false,
      color
    );

  }

  selection.removeAllRanges();

  selection.addRange(range);

  saveSelection();

}


/* -----------------------------
   چونڊيل رنگ ختم
----------------------------- */

function removeSelectedColor() {

  editor.focus();

  restoreSelection();

  const selection = window.getSelection();

  if (!selection.rangeCount) return;

  const range = selection.getRangeAt(0);

  if (range.collapsed) {

    alert("پهريان لفظ يا جملو Select ڪريو.");

    return;

  }

  document.execCommand(
    "removeFormat",
    false,
    null
  );

  saveSelection();

}


/* -----------------------------
   فانٽ
----------------------------- */

function changeFont() {

  editor.focus();

  restoreSelection();

  const font =
    document.getElementById("fontSelect").value;

  document.execCommand(
    "fontName",
    false,
    font
  );

  saveSelection();

  localStorage.setItem(
    "keyboardFont",
    font
  );

}


/* -----------------------------
   فونٽ سائيز
----------------------------- */

function changeSize() {

  editor.focus();

  restoreSelection();

  const size =
    document.getElementById("sizeSelect").value;

  editor.style.fontSize = size;

  localStorage.setItem(
    "keyboardFontSize",
    size
  );

}


/* -----------------------------
   محفوظ سيٽنگون واپس آڻڻ
----------------------------- */

window.addEventListener("load", function() {

  const savedFont =
    localStorage.getItem("keyboardFont");

  const savedSize =
    localStorage.getItem("keyboardFontSize");


  if (savedFont) {

    document.getElementById(
      "fontSelect"
    ).value = savedFont;

  }


  if (savedSize) {

    document.getElementById(
      "sizeSelect"
    ).value = savedSize;

    editor.style.fontSize = savedSize;

  }

});


/* -----------------------------
   Offline Service Worker
----------------------------- */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", function() {

    navigator.serviceWorker
      .register("./sw.js")
      .catch(function() {});

  });

}

</script>

</body>
</html>
