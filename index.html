
<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سنڌي شاعري ڪي بورڊ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f1e8;
  color:#173f35;
  font-family:Arial,sans-serif;
}

header{
  background:#173f35;
  color:#f3d27a;
  text-align:center;
  padding:15px 8px;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:5px 0 0;
  color:#fff4d0;
}

.settings,
.editor,
.keyboard-box{
  max-width:950px;
  margin:12px auto;
  padding:14px;
  background:#fffdf7;
  border:2px solid #d3b568;
  border-radius:14px;
}

.settings h2{
  margin:0 0 12px;
  font-size:20px;
}

.setting-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin:9px 0;
}

.setting-row label{
  font-weight:bold;
}

select,
input[type="number"]{
  padding:8px;
  border:1px solid #b7a46c;
  border-radius:8px;
  font-size:16px;
  background:white;
}

#colorPicker{
  width:52px;
  height:38px;
  padding:2px;
  cursor:pointer;
}

.color-button{
  background:#173f35;
  color:white;
  border:0;
  border-radius:8px;
  padding:9px 13px;
  cursor:pointer;
  font-size:16px;
}

.editor{
  padding:10px;
}

#editor{
  min-height:190px;
  padding:14px;
  border:1px solid #b7a46c;
  border-radius:10px;
  background:#fffefb;
  outline:none;
  line-height:2;
  font-size:26px;
  font-family:"Jameel Noori Nastaleeq",serif;
  white-space:pre-wrap;
  word-break:break-word;
}

#editor:empty:before{
  content:"هتي شاعري لکو...";
  color:#999;
}

.title{
  text-align:center;
  font-weight:bold;
  font-size:20px;
  margin-bottom:10px;
}

.keys{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  direction:rtl;
}

.key{
  min-width:42px;
  min-height:43px;
  padding:7px 9px;
  border:1px solid #b89b4d;
  border-radius:8px;
  background:#f4e6b8;
  color:#173f35;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 2px 3px rgba(0,0,0,.12);
}

.key:active{
  transform:scale(.95);
}

.control{
  background:#173f35;
  color:white;
}

.clear{
  background:#8b302b;
  color:white;
}

.space{
  min-width:145px !important;
}

.english{
  direction:ltr;
}

.english .key{
  font-size:18px;
  background:#e8e2d3;
}

.note{
  text-align:center;
  font-size:13px;
  color:#666;
  padding:5px 10px 15px;
}

@media(max-width:600px){
  header h1{font-size:21px}

  .key{
    min-width:37px;
    min-height:40px;
    font-size:18px;
    padding:6px 7px;
  }

  .space{
    min-width:120px !important;
  }
}
</style>
</head>

<body>

<header>
  <h1>سنڌي شاعري ڪي بورڊ</h1>
  <p>🖋️ فانٽ ۽ ڪلر سليڪشن</p>
</header>

<div class="settings">

      <option value="Arial, sans-serif">Arial</option>
      <option value='"Noto Nastaliq Urdu", serif'>Noto Nastaliq Urdu</option>

  <div class="setting-row">
    <label>سائيز:</label>

      id="fontSize"

    >

    <button class="key" onclick="insertText('Q')">Q</button>

<div class="note">
  لفظ سليڪٽ ڪريو، پوءِ مٿي ڪلر چونڊيو — صرف سليڪٽ ٿيل لفظ جو رنگ تبديل ٿيندو.
</div>

<script>

const editor = document.getElementById("editor");
const fontSelect = document.getElementById("fontSelect");
const fontSize = document.getElementById("fontSize");
const colorPicker = document.getElementById("colorPicker");
const removeColorBtn = document.getElementById("removeColorBtn");

let savedRange = null;


/* =========================
   SAVE SELECTION
========================= */

function saveSelection(){

  const selection = window.getSelection();

  if(
    selection.rangeCount > 0 &&
    !selection.isCollapsed &&
    editor.contains(selection.anchorNode) &&
    editor.contains(selection.focusNode)
  ){
    savedRange = selection.getRangeAt(0).cloneRange();
    return true;
  }

  return false;
}


/* =========================
   RESTORE SELECTION
========================= */

function restoreSelection(){

  if(!savedRange) return false;

  if(
    !editor.contains(savedRange.startContainer) ||
    !editor.contains(savedRange.endContainer)
  ){
    return false;
  }

  const selection = window.getSelection();

  selection.removeAllRanges();
  selection.addRange(savedRange);

  return true;
}


/* =========================
   EDITOR SELECTION
========================= */

editor.addEventListener("mouseup",function(){
  setTimeout(saveSelection,10);
});

editor.addEventListener("keyup",function(){
  setTimeout(saveSelection,10);
});

editor.addEventListener("touchend",function(){
  setTimeout(saveSelection,150);
});


/* =========================
   INSERT TEXT
========================= */

function insertText(text){

  editor.focus();

  restoreSelection();

  const selection = window.getSelection();

  let range;

  if(selection.rangeCount){
    range = selection.getRangeAt(0);
  }else{
    range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
  }

  range.deleteContents();

  const node = document.createTextNode(text);

  range.insertNode(node);

  range.setStartAfter(node);
  range.collapse(true);

  selection.removeAllRanges();
  selection.addRange(range);

  savedRange = range.cloneRange();
}


/* =========================
   BACKSPACE
========================= */

function backspace(){

  editor.focus();

  restoreSelection();

  const selection = window.getSelection();

  if(!selection.rangeCount) return;

  const range = selection.getRangeAt(0);

  if(!range.collapsed){

    range.deleteContents();

  }else{

    if(
      range.startContainer.nodeType === Node.TEXT_NODE &&
      range.startOffset > 0
    ){

      range.setStart(
        range.startContainer,
        range.startOffset - 1
      );

      range.deleteContents();

    }
  }

  savedRange = null;
}


/* =========================
   FONT
========================= */

fontSelect.addEventListener("change",function(){

  editor.style.fontFamily = this.value;

});


/* =========================
   FONT SIZE
========================= */

fontSize.addEventListener("input",function(){

  let size = parseInt(this.value,10);

  if(isNaN(size)) size = 26;

  size = Math.max(12,Math.min(80,size));

  this.value = size;

  editor.style.fontSize = size + "px";

});


/* =================================================
   IMPORTANT COLOR FIX
================================================= */

/*
   color input تي ڪلڪ ڪرڻ کان اڳ selection محفوظ.
*/

colorPicker.addEventListener("mousedown",function(e){

  e.preventDefault();

  saveSelection();

  /*
     Native color picker کولڻ لاءِ click manually.
  */

  setTimeout(function(){
    colorPicker.click();
  },0);

});


/*
   موبائل لاءِ.
*/

colorPicker.addEventListener("touchstart",function(){

  saveSelection();

},{passive:true});


/*
   Color بدلجڻ کان پوءِ selection ٻيهر restore.
*/

colorPicker.addEventListener("input",function(){

  applyColor(this.value);

});


colorPicker.addEventListener("change",function(){

  applyColor(this.value);

});


/* =========================
   APPLY COLOR
========================= */

function applyColor(color){

  if(!savedRange){
    return;
  }

  if(
    !editor.contains(savedRange.startContainer) ||
    !editor.contains(savedRange.endContainer)
  ){
    return;
  }

  const range = savedRange.cloneRange();

  if(range.collapsed){
    return;
  }

  /*
     چونڊيل حصو ڪڍون ٿا.
  */

  const fragment = range.extractContents();

  /*
     نئون span ٺاهيون ٿا.
  */

  const span = document.createElement("span");

  span.style.color = color;

  span.appendChild(fragment);

  range.insertNode(span);


  /*
     ٻيهر چونڊ محفوظ.
  */

  const newRange = document.createRange();

  newRange.selectNodeContents(span);

  const selection = window.getSelection();

  selection.removeAllRanges();
  selection.addRange(newRange);

  savedRange = newRange.cloneRange();

}


/* =========================
   REMOVE COLOR
========================= */

removeColorBtn.addEventListener("mousedown",function(){

  saveSelection();

});


removeColorBtn.addEventListener("touchstart",function(){

  saveSelection();

},{passive:true});


removeColorBtn.addEventListener("click",function(){

  removeSelectedColor();

});


function removeSelectedColor(){

  if(!savedRange){
    return;
  }

  const range = savedRange.cloneRange();

  if(range.collapsed){
    return;
  }

  if(
    !editor.contains(range.startContainer) ||
    !editor.contains(range.endContainer)
  ){
    return;
  }

  const fragment = range.extractContents();

  const span = document.createElement("span");

  span.style.color = "#173f35";

  span.appendChild(fragment);

  range.insertNode(span);

  const newRange = document.createRange();

  newRange.selectNodeContents(span);

  const selection = window.getSelection();

  selection.removeAllRanges();
  selection.addRange(newRange);

  savedRange = newRange.cloneRange();

}


/* =========================
   CLEAR
========================= */

function clearText(){

  if(confirm("ڇا توهان سڄي لکڻي صاف ڪرڻ چاهيو ٿا؟")){

    editor.innerHTML = "";

    savedRange = null;

    editor.focus();

  }

}

</script>
