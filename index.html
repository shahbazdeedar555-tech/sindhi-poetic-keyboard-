<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>سنڌي شاعري ڪي بورڊ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f5f1e8;
  color:#173f35;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

header{
  background:#173f35;
  color:#f5d77a;
  text-align:center;
  padding:16px 10px 14px;
  border-bottom:4px solid #c9a646;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}

header h1{
  margin:0;
  font-size:25px;
  font-weight:bold;
}

header p{
  margin:5px 0 0;
  color:#fff7df;
  font-size:14px;
}

/* MAIN */
.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:10px;
}

/* TOOL PANEL */
.tools{
  background:#fffdf7;
  border:1px solid #d8c99b;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.tools-title{
  font-size:18px;
  font-weight:bold;
  color:#173f35;
  margin-bottom:10px;
  text-align:right;
}

.control-row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:9px;
}

.control-row label{
  font-weight:bold;
  font-size:14px;
}

select,
input[type="number"]{
  min-height:42px;
  border:1px solid #bda95f;
  border-radius:9px;
  background:white;
  padding:6px 10px;
  font-size:16px;
}

input[type="color"]{
  width:52px;
  height:42px;
  border:1px solid #bda95f;
  border-radius:9px;
  background:white;
  padding:3px;
}

.color-btn{
  min-height:42px;
  padding:7px 12px;
  border:0;
  border-radius:9px;
  background:#173f35;
  color:white;
  font-size:15px;
  font-weight:bold;
}

/* WRITING AREA */
.editor{
  background:#fff;
  border:2px solid #c9a646;
  border-radius:14px;
  min-height:190px;
  padding:15px;
  margin-bottom:10px;
  box-shadow:inset 0 1px 5px rgba(0,0,0,.05);
}

#writingArea{
  width:100%;
  min-height:155px;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:#173f35;
  direction:rtl;
  text-align:right;
  line-height:1.9;
  font-family:"Jameel Noori Nastaleeq",
              "Noto Nastaliq Urdu",
              serif;
}

/* SPECIAL SYMBOLS */
.section-title{
  font-weight:bold;
  font-size:17px;
  margin:8px 0;
}

.special-row{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-bottom:10px;
}

.special-key{
  min-height:44px;
  border:1px solid #c9a646;
  border-radius:9px;
  background:#fffdf7;
  color:#173f35;
  font-size:21px;
  font-weight:bold;
  touch-action:manipulation;
}

/* KEYBOARD */
.keyboard{
  background:#ded6c5;
  border-radius:16px;
  padding:7px 4px 9px;
  box-shadow:0 3px 12px rgba(0,0,0,.16);
  direction:rtl;
}

.key-row{
  display:flex;
  width:100%;
  gap:4px;
  margin-bottom:5px;
  justify-content:center;
}

.key{
  flex:1 1 0;
  min-width:0;
  min-height:52px;
  border:1px solid #b8a98b;
  border-radius:9px;
  background:#fffdf8;
  color:#173f35;
  font-family:
    "Noto Nastaliq Urdu",
    "Jameel Noori Nastaleeq",
    serif;
  font-size:22px;
  font-weight:bold;
  padding:3px 1px;
  box-shadow:0 2px 1px rgba(0,0,0,.12);
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

.key:active{
  transform:translateY(2px);
  background:#eadfb9;
  box-shadow:none;
}

.key.action{
  background:#173f35;
  color:#fff7df;
  font-family:Arial,sans-serif;
  font-size:17px;
}

.key.shift-active{
  background:#c9a646;
  color:#173f35;
}

.key.space{
  flex:5;
  font-family:Arial,sans-serif;
  font-size:17px;
}

.key.backspace{
  flex:1.5;
}

.key.shift{
  flex:1.5;
}

/* EXTRA ACTIONS */
.bottom-actions{
  display:flex;
  gap:5px;
  margin-top:5px;
}

.bottom-actions button{
  flex:1;
  min-height:50px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  touch-action:manipulation;
}

.copy-btn{
  background:#173f35;
  color:white;
}

.clear-btn{
  background:#9b4938;
  color:white;
}

/* FOOTER */
footer{
  text-align:center;
  color:#75683e;
  font-size:13px;
  padding:14px 5px 20px;
}

/* SMALL MOBILE */
@media(max-width:420px){

  header h1{
    font-size:22px;
  }

  .container{
    padding:7px;
  }

  .key{
    min-height:48px;
    font-size:20px;
    border-radius:8px;
  }

  .special-key{
    min-height:40px;
    font-size:18px;
  }

  .keyboard{
    padding:6px 3px 8px;
  }

}

/* VERY SMALL */
@media(max-width:350px){

  .key{
    min-height:44px;
    font-size:18px;
  }

  .key.action{
    font-size:14px;
  }

}
</style>
</head>

<body>

<header>
  <h1>سنڌي شاعري ڪي بورڊ</h1>
  <p>سنڌي شاعري لاءِ خوبصورت موبائيل ڪي بورڊ</p>
</header>

<div class="container">

  <!-- FONT & COLOR -->
  <div class="tools">

    <div class="tools-title">
      🖋️ فانٽ ۽ ڪلر سليڪشن
    </div>

    <div class="control-row">
      <label>فانٽ:</label>

      <select id="fontSelect">
        <option value="Jameel Noori Nastaleeq">
          Jameel Noori Nastaleeq
        </option>

        <option value="Noto Nastaliq Urdu">
          Noto Nastaliq Urdu
        </option>

        <option value="Arial">
          Arial
        </option>
      </select>
    </div>

    <div class="control-row">

      <label>سائيز:</label>

      <input
        id="fontSize"
        type="number"
        value="26"
        min="12"
        max="60"
      >

      <span>px</span>

    </div>

    <div class="control-row">

      <label>چونڊيل لفظ جو رنگ:</label>

      <input
        id="textColor"
        type="color"
        value="#173f35"
      >

      <button
        class="color-btn"
        id="resetColor"
        type="button">
        رنگ ختم
      </button>

    </div>

  </div>

  <!-- WRITING AREA -->
  <div class="editor">

    <textarea
      id="writingArea"
      spellcheck="false"
      placeholder="هتي پنهنجي شاعري لکو...">
    </textarea>

  </div>

  <!-- SPECIAL SYMBOLS -->
  <div class="section-title">
    خاص نشانيون
  </div>

  <div class="special-row">

    <button class="special-key" data-char="ـ">ـ</button>
    <button class="special-key" data-char="َ">َ</button>
    <button class="special-key" data-char="ِ">ِ</button>
    <button class="special-key" data-char="ُ">ُ</button>
    <button class="special-key" data-char="ْ">ْ</button>
    <button class="special-key" data-char="ّ">ّ</button>
    <button class="special-key" data-char="ٰ">ٰ</button>

  </div>

  <!-- KEYBOARD -->
  <div class="keyboard" id="keyboard">

    <!-- ROW 1 -->
    <div class="key-row">

      <button class="key" data-normal="ا" data-shift="آ">ا</button>
      <button class="key" data-normal="ب" data-shift="ٻ">ب</button>
      <button class="key" data-normal="ٻ" data-shift="ڀ">ٻ</button>
      <button class="key" data-normal="پ" data-shift="ڦ">پ</button>
      <button class="key" data-normal="ڀ" data-shift="ٿ">ڀ</button>
      <button class="key" data-normal="ت" data-shift="ٽ">ت</button>
      <button class="key" data-normal="ٺ" data-shift="ٿ">ٺ</button>
      <button class="key" data-normal="ٽ" data-shift="ث">ٽ</button>
      <button class="key" data-normal="ث" data-shift="ٿ">ث</button>
      <button class="key" data-normal="ٿ" data-shift="ٺ">ٿ</button>

    </div>

    <!-- ROW 2 -->
    <div class="key-row">

      <button class="key" data-normal="ف" data-shift="ڦ">ف</button>
      <button class="key" data-normal="ڦ" data-shift="ف">ڦ</button>
      <button class="key" data-normal="گ" data-shift="ڳ">گ</button>
      <button class="key" data-normal="ڳ" data-shift="ڱ">ڳ</button>
      <button class="key" data-normal="ڱ" data-shift="گ">ڱ</button>
      <button class="key" data-normal="ک" data-shift="خ">ک</button>
      <button class="key" data-normal="خ" data-shift="ک">خ</button>
      <button class="key" data-normal="ي" data-shift="ى">ي</button>
      <button class="key" data-normal="ى" data-shift="ي">ى</button>
      <button class="key" data-normal="د" data-shift="ڊ">د</button>

    </div>

    <!-- ROW 3 -->
    <div class="key-row">

      <button class="key" data-normal="ڊ" data-shift="ڍ">ڊ</button>
      <button class="key" data-normal="ڍ" data-shift="ڌ">ڍ</button>
      <button class="key" data-normal="ڌ" data-shift="ڏ">ڌ</button>
      <button class="key" data-normal="ڏ" data-shift="ذ">ڏ</button>
      <button class="key" data-normal="ذ" data-shift="ز">ذ</button>
      <button class="key" data-normal="ر" data-shift="ڙ">ر</button>
      <button class="key" data-normal="ڙ" data-shift="ز">ڙ</button>
      <button class="key" data-normal="ز" data-shift="ژ">ز</button>
      <button class="key" data-normal="س" data-shift="ش">س</button>
      <button class="key" data-normal="ش" data-shift="ص">ش</button>

    </div>

    <!-- ROW 4 -->
    <div class="key-row">

      <button class="key" data-normal="ص" data-shift="ض">ص</button>
      <button class="key" data-normal="ض" data-shift="ط">ض</button>
      <button class="key" data-normal="ط" data-shift="ظ">ط</button>
      <button class="key" data-normal="ظ" data-shift="ع">ظ</button>
      <button class="key" data-normal="ع" data-shift="غ">ع</button>
      <button class="key" data-normal="غ" data-shift="ق">غ</button>
      <button class="key" data-normal="ق" data-shift="ڪ">ق</button>
      <button class="key" data-normal="ڪ" data-shift="ل">ڪ</button>
      <button class="key" data-normal="ل" data-shift="م">ل</button>
      <button class="key" data-normal="م" data-shift="ن">م</button>

    </div>

    <!-- ROW 5 -->
    <div class="key-row">

      <button class="key" data-normal="ن" data-shift="ڻ">ن</button>
      <button class="key" data-normal="ڻ" data-shift="و">ڻ</button>
      <button class="key" data-normal="و" data-shift="ؤ">و</button>
      <button class="key" data-normal="ه" data-shift="ھ">ه</button>
      <button class="key" data-normal="ھ" data-shift="ح">ھ</button>
      <button class="key" data-normal="ح" data-shift="چ">ح</button>
      <button class="key" data-normal="چ" data-shift="ج">چ</button>
      <button class="key" data-normal="ج" data-shift="ڇ">ج</button>
      <button class="key" data-normal="ڇ" data-shift="ڃ">ڇ</button>
      <button class="key" data-normal="ڃ" data-shift="ڻ">ڃ</button>

    </div>

    <!-- ROW 6 -->
    <div class="key-row">

      <button class="key" data-normal="ء" data-shift="ئ">ء</button>
      <button class="key" data-normal="ئ" data-shift="ؤ">ئ</button>
      <button class="key" data-normal="ؤ" data-shift="ي">ؤ</button>

      <button
        class="key action shift"
        id="shiftBtn"
        type="button">
        ⇧ شفٽ
      </button>

      <button
        class="key action"
        data-special="nahi"
        type="button">
        نہ
      </button>

      <button
        class="key action"
        data-special="bhi"
        type="button">
        بہ
      </button>

      <button
        class="key action"
        data-char="ى"
        type="button">
        ى
      </button>

      <button
        class="key action backspace"
        id="backspaceBtn"
        type="button">
        ⌫
      </button>

    </div>

    <!-- SPACE -->
    <div class="key-row">

      <button
        class="key action"
        id="dashBtn"
        type="button">
        ـ
      </button>

      <button
        class="key space"
        id="spaceBtn"
        type="button">
        اسپيس
      </button>

      <button
        class="key action"
        id="enterBtn"
        type="button">
        ↵ نئين سٽ
      </button>

    </div>

    <!-- ACTIONS -->
    <div class="bottom-actions">

      <button
        class="copy-btn"
        id="copyBtn"
        type="button">
        📋 ڪاپي
      </button>

      <button
        class="clear-btn"
        id="clearBtn"
        type="button">
        🗑 صاف
      </button>

    </div>

  </div>

</div>

<footer>
  سنڌي شاعري ڪي بورڊ © 2026
</footer>


<script>

const textarea = document.getElementById("writingArea");
const fontSelect = document.getElementById("fontSelect");
const fontSize = document.getElementById("fontSize");
const textColor = document.getElementById("textColor");
const resetColor = document.getElementById("resetColor");
const shiftBtn = document.getElementById("shiftBtn");

let shiftMode = false;


/* -----------------------------
   INSERT TEXT AT CURSOR
----------------------------- */

function insertText(text){

  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;

  const before = textarea.value.substring(0,start);
  const after = textarea.value.substring(end);

  textarea.value = before + text + after;

  const newPosition = start + text.length;

  textarea.focus();
  textarea.setSelectionRange(
    newPosition,
    newPosition
  );
}


/* -----------------------------
   NORMAL LETTER KEYS
----------------------------- */

document.querySelectorAll(
  ".key[data-normal]"
).forEach(function(button){

  button.addEventListener("click",function(){

    const normal =
      button.getAttribute("data-normal");

    const shifted =
      button.getAttribute("data-shift");

    insertText(
      shiftMode && shifted
      ? shifted
      : normal
    );

    if(shiftMode){
      shiftMode=false;
      shiftBtn.classList.remove(
        "shift-active"
      );
    }

  });

});


/* -----------------------------
   SPECIAL CHARACTER KEYS
----------------------------- */

document.querySelectorAll(
  ".special-key"
).forEach(function(button){

  button.addEventListener("click",function(){

    insertText(
      button.getAttribute("data-char")
    );

  });

});


/* -----------------------------
   SPECIAL BAH / NAH
----------------------------- */

document.querySelectorAll(
  "[data-special]"
).forEach(function(button){

  button.addEventListener("click",function(){

    const type =
      button.getAttribute("data-special");

    if(type === "nahi"){
      insertText("نہ");
    }

    if(type === "bhi"){
      insertText("بہ");
    }

  });

});


/* -----------------------------
   DIRECT CHARACTER BUTTONS
----------------------------- */

document.querySelectorAll(
  ".key[data-char]"
).forEach(function(button){

  button.addEventListener("click",function(){

    insertText(
      button.getAttribute("data-char")
    );

  });

});


/* -----------------------------
   SHIFT
----------------------------- */

shiftBtn.addEventListener(
  "click",
  function(){

    shiftMode = !shiftMode;

    shiftBtn.classList.toggle(
      "shift-active",
      shiftMode
    );

  }
);


/* -----------------------------
   SPACE
----------------------------- */

document.getElementById(
  "spaceBtn"
).addEventListener(
  "click",
  function(){

    insertText(" ");

  }
);


/* -----------------------------
   LONG DASH
----------------------------- */

document.getElementById(
  "dashBtn"
).addEventListener(
  "click",
  function(){

    insertText("ـ");

  }
);


/* -----------------------------
   ENTER
----------------------------- */

document.getElementById(
  "enterBtn"
).addEventListener(
  "click",
  function(){

    insertText("\n");

  }
);


/* -----------------------------
   BACKSPACE
----------------------------- */

document.getElementById(
  "backspaceBtn"
).addEventListener(
  "click",
  function(){

    const start =
      textarea.selectionStart;

    const end =
      textarea.selectionEnd;

    if(start !== end){

      textarea.value =
        textarea.value.substring(0,start) +
        textarea.value.substring(end);

      textarea.focus();
      textarea.setSelectionRange(
        start,
        start
      );

      return;
    }

    if(start > 0){

      textarea.value =
        textarea.value.substring(0,start-1) +
        textarea.value.substring(end);

      textarea.focus();

      textarea.setSelectionRange(
        start-1,
        start-1
      );

    }

  }
);


/* -----------------------------
   FONT
----------------------------- */

fontSelect.addEventListener(
  "change",
  function(){

    textarea.style.fontFamily =
      this.value;

  }
);


/* -----------------------------
   FONT SIZE
----------------------------- */

fontSize.addEventListener(
  "input",
  function(){

    let size =
      parseInt(this.value);

    if(isNaN(size)){
      size = 26;
    }

    if(size < 12){
      size = 12;
    }

    if(size > 60){
      size = 60;
    }

    textarea.style.fontSize =
      size + "px";

  }
);


/* -----------------------------
   TEXT COLOR
----------------------------- */

textColor.addEventListener(
  "input",
  function(){

    const start =
      textarea.selectionStart;

    const end =
      textarea.selectionEnd;

    /*
      Textarea cannot color only one
      selected word directly.
      For now the selected text is
      remembered for the next stage.
    */

    if(start !== end){

      textarea.dataset.colorStart = start;
      textarea.dataset.colorEnd = end;

    }

  }
);


/* -----------------------------
   RESET COLOR
----------------------------- */

resetColor.addEventListener(
  "click",
  function(){

    textarea.style.color =
      "#173f35";

    textColor.value =
      "#173f35";

  }
);


/* -----------------------------
   COPY
----------------------------- */

document.getElementById(
  "copyBtn"
).addEventListener(
  "click",
  async function(){

    try{

      await navigator.clipboard.writeText(
        textarea.value
      );

      this.textContent =
        "✓ ڪاپي ٿي وئي";

      setTimeout(()=>{
        this.textContent =
          "📋 ڪاپي";
      },1500);

    }catch(error){

      textarea.select();
      document.execCommand("copy");

      this.textContent =
        "✓ ڪاپي ٿي وئي";

      setTimeout(()=>{
        this.textContent =
          "📋 ڪاپي";
      },1500);

    }

  }
);


/* -----------------------------
   CLEAR
----------------------------- */

document.getElementById(
  "clearBtn"
).addEventListener(
  "click",
  function(){

    if(
      textarea.value === "" ||
      confirm("ڇا سڄو لکيل متن صاف ڪجي؟")
    ){

      textarea.value = "";

    }

    textarea.focus();

  }
);


/* -----------------------------
   PREVENT PAGE ZOOM
----------------------------- */

document.addEventListener(
  "gesturestart",
  function(event){
    event.preventDefault();
  }
);

</script>

</body>
</html>
