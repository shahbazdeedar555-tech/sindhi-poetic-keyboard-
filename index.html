
<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سنڌي شاعري ڪي بورڊ</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#173f35">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f1e8;
  color:#173f35;
  font-family:Arial,sans-serif;
}

header{
  background:#173f35;
  color:#f5d98b;
  text-align:center;
  padding:18px 10px;
  font-size:26px;
  font-weight:bold;
  border-bottom:4px solid #c9a44c;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fffdf8;
  border:1px solid #d8c79d;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

h2{
  margin-top:0;
  color:#173f35;
  font-size:21px;
}

label{
  display:block;
  margin:10px 0 6px;
  font-weight:bold;
}

select,
input,
button{
  font-size:16px;
  min-height:44px;
  border-radius:8px;
  border:1px solid #c9b77c;
}

select,
input{
  width:100%;
  padding:8px;
  background:white;
}

button{
  padding:8px 14px;
  background:#173f35;
  color:#f5d98b;
  cursor:pointer;
  border:1px solid #c9a44c;
}

button:active{
  transform:scale(.98);
}

.settings-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.editor{
  width:100%;
  min-height:170px;
  border:2px solid #c9a44c;
  border-radius:12px;
  padding:18px;
  background:#fffdf8;
  direction:rtl;
  text-align:right;
  outline:none;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.editor:focus{
  border-color:#173f35;
}

.special-title{
  margin-top:16px;
  margin-bottom:8px;
  font-weight:bold;
}

.special-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.special-row button{
  min-width:44px;
  padding:5px 10px;
  font-size:20px;
}

.keyboard-title{
  margin-top:18px;
  font-weight:bold;
}

.keyboard{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:8px;
}

.key{
  min-height:48px;
  padding:4px;
  font-size:22px;
  background:#173f35;
  color:#fff8df;
  border:1px solid #c9a44c;
  border-radius:8px;
}

.key:hover{
  background:#245448;
}

.action-key{
  background:#7b5e22;
}

.space-key{
  grid-column:span 4;
}

.status{
  text-align:center;
  color:#52645e;
  font-size:14px;
  margin-top:10px;
}

.footer{
  text-align:center;
  padding:18px 10px;
  color:#52645e;
  font-size:14px;
}

/* ------------------------------
   Font Styles
------------------------------ */

.font-jameel{
  font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu",serif;
}

.font-noto{
  font-family:"Noto Nastaliq Urdu",serif;
}

/* نئون ڪليوگرافڪ فونٽ */
.font-calligraphic{
  font-family:"Noto Nastaliq Urdu","Amiri","Lateef",serif;
  font-weight:500;
}

.font-calligraphy{
  font-family:"Amiri","Noto Nastaliq Urdu",serif;
}

.font-elegant{
  font-family:"Lateef","Noto Nastaliq Urdu",serif;
}

.font-arabic{
  font-family:"Traditional Arabic","Scheherazade New",serif;
}

.font-kufi{
  font-family:"Noto Kufi Arabic","Noto Sans Arabic",sans-serif;
}

.font-serif{
  font-family:Georgia,"Times New Roman",serif;
}

.font-sans{
  font-family:Arial,"Noto Sans Arabic",sans-serif;
}

/* Calligraphy preview */

.calligraphy-preview{
  font-size:30px;
  line-height:1.8;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  background:#f5f1e8;
  text-align:center;
  color:#173f35;
}

@media(max-width:600px){

  header{
    font-size:22px;
  }

  .container{
    padding:10px;
  }

  .keyboard{
    grid-template-columns:repeat(6,1fr);
    gap:5px;
  }

  .key{
    min-height:46px;
    font-size:20px;
  }

  .space-key{
    grid-column:span 3;
  }

  .editor{
    min-height:150px;
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>
  سنڌي شاعري ڪي بورڊ
</header>

<div class="container">

  <!-- Font Settings -->

  <div class="card">

    <h2>🖋️ فانٽ ۽ ڪلر سليڪشن</h2>

    <div class="settings-grid">

      <div>

        <label for="fontSelect">فونٽ:</label>

        <select id="fontSelect">

          <option value="font-jameel">
            Jameel Noori Nastaleeq
          </option>

          <option value="font-noto">
            Noto Nastaliq Urdu
          </option>

          <!-- نئون فونٽ -->

          <option value="font-calligraphic">
            Calligraphic — ڪليوگرافڪ
          </option>

          <option value="font-calligraphy">
            Amiri — Calligraphy
          </option>

          <option value="font-elegant">
            Lateef — Calligraphy
          </option>

          <option value="font-arabic">
            Traditional Arabic
          </option>

          <option value="font-kufi">
            Noto Kufi Arabic
          </option>

          <option value="font-serif">
            Elegant Serif
          </option>

          <option value="font-sans">
            Noto / Arial
          </option>

        </select>

      </div>

      <div>

        <label for="fontSize">سائيز:</label>

        <input
          type="number"
          id="fontSize"
          min="16"
          max="60"
          value="26"
        >

        <span>px</span>

      </div>

      <div>

        <label for="textColor">
          چونڊيل لفظ جو رنگ:
        </label>

        <input
          type="color"
          id="textColor"
          value="#173f35"
        >

      </div>

    </div>

    <button type="button" id="resetColor">
      رنگ ختم
    </button>

    <div
      id="calligraphyPreview"
      class="calligraphy-preview font-jameel"
    >
      سنڌي شاعري ـ احساسن جي زبان
    </div>

  </div>


  <!-- Writing Area -->

  <div class="card">

    <h2>✍️ شاعري لکڻ لاءِ جاءِ</h2>

    <div
      id="editor"
      class="editor font-jameel"
      contenteditable="true"
      spellcheck="false"
      aria-label="سنڌي شاعري لکڻ جي جاءِ"
    ></div>

    <div class="status">
      پنهنجي شاعري هتي لکو ۽ هيٺ ڏنل ڪي بورڊ استعمال ڪريو.
    </div>

  </div>


  <!-- Special Characters -->

  <div class="card">

    <div class="special-title">
      خاص نشانيون
    </div>

    <div class="special-row">

      <button type="button" data-char="ـ">ـ</button>
      <button type="button" data-char="َ">َ</button>
      <button type="button" data-char="ِ">ِ</button>
      <button type="button" data-char="ُ">ُ</button>
      <button type="button" data-char="ْ">ْ</button>
      <button type="button" data-char="ّ">ّ</button>
      <button type="button" data-char="ٰ">ٰ</button>

    </div>

  </div>


  <!-- Keyboard -->

  <div class="card">

    <div class="keyboard-title">
      سنڌي ڪي بورڊ
    </div>

    <div id="keyboard" class="keyboard">

      <!-- Row 1 -->

      <button class="key" data-key="آ">آ</button>
      <button class="key" data-key="ا">ا</button>
      <button class="key" data-key="ب">ب</button>
      <button class="key" data-key="ٻ">ٻ</button>
      <button class="key" data-key="ڀ">ڀ</button>
      <button class="key" data-key="ت">ت</button>
      <button class="key" data-key="ٿ">ٿ</button>

      <!-- Row 2 -->

      <button class="key" data-key="ٽ">ٽ</button>
      <button class="key" data-key="ٺ">ٺ</button>
      <button class="key" data-key="ث">ث</button>
      <button class="key" data-key="ج">ج</button>
      <button class="key" data-key="ڄ">ڄ</button>
      <button class="key" data-key="جهه">جھ</button>
      <button class="key" data-key="چ">چ</button>

      <!-- Row 3 -->

      <button class="key" data-key="ڇ">ڇ</button>
      <button class="key" data-key="ح">ح</button>
      <button class="key" data-key="خ">خ</button>
      <button class="key" data-key="د">د</button>
      <button class="key" data-key="ڌ">ڌ</button>
      <button class="key" data-key="ڏ">ڏ</button>
      <button class="key" data-key="ڊ">ڊ</button>

      <!-- Row 4 -->

      <button class="key" data-key="ڍ">ڍ</button>
      <button class="key" data-key="ذ">ذ</button>
      <button class="key" data-key="ر">ر</button>
      <button class="key" data-key="ڙ">ڙ</button>
      <button class="key" data-key="ز">ز</button>
      <button class="key" data-key="س">س</button>
      <button class="key" data-key="ش">ش</button>

      <!-- Row 5 -->

      <button class="key" data-key="ص">ص</button>
      <button class="key" data-key="ض">ض</button>
      <button class="key" data-key="ط">ط</button>
      <button class="key" data-key="ظ">ظ</button>
      <button class="key" data-key="ع">ع</button>
      <button class="key" data-key="غ">غ</button>
      <button class="key" data-key="ف">ف</button>

      <!-- Row 6 -->

      <button class="key" data-key="ڦ">ڦ</button>
      <button class="key" data-key="ق">ق</button>
      <button class="key" data-key="ڪ">ڪ</button>
      <button class="key" data-key="ک">ک</button>
      <button class="key" data-key="گ">گ</button>
      <button class="key" data-key="ڳ">ڳ</button>
      <button class="key" data-key="گھ">گھ</button>

      <!-- Row 7 -->

      <button class="key" data-key="ل">ل</button>
      <button class="key" data-key="م">م</button>
      <button class="key" data-key="ن">ن</button>
      <button class="key" data-key="ڻ">ڻ</button>
      <button class="key" data-key="و">و</button>
      <button class="key" data-key="ه">ه</button>
      <button class="key" data-key="ء">ء</button>

      <!-- Row 8 -->

      <button class="key" data-key="ي">ي</button>
      <button class="key" data-key="ئ">ئ</button>
      <button class="key" data-key="ى">ى</button>
      <button class="key" data-key="ے">ے</button>
      <button class="key" data-key="ۿ">ۿ</button>
      <button class="key" data-key=".">.</button>
      <button class="key" data-key=",">،</button>

      <!-- Numbers -->

      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key" data-key="0">0</button>

      <!-- Actions -->

      <button
        type="button"
        class="key action-key"
        id="backspace"
      >
        ⌫
      </button>

      <button
        type="button"
        class="key action-key"
        id="enter"
      >
        ↵
      </button>

      <button
        type="button"
        class="key space-key"
        id="space"
      >
        اسپيس
      </button>

    </div>

  </div>

</div>


<div class="footer">
  سنڌي شاعري ڪي بورڊ © 2026
</div>


<script>

const editor =
  document.getElementById("editor");

const fontSelect =
  document.getElementById("fontSelect");

const fontSize =
  document.getElementById("fontSize");

const textColor =
  document.getElementById("textColor");

const resetColor =
  document.getElementById("resetColor");

const preview =
  document.getElementById("calligraphyPreview");


/* Insert Text */

function insertText(text){

  editor.focus();

  const selection =
    window.getSelection();

  if(!selection.rangeCount){

    editor.appendChild(
      document.createTextNode(text)
    );

    return;
  }

  const range =
    selection.getRangeAt(0);

  range.deleteContents();

  const node =
    document.createTextNode(text);

  range.insertNode(node);

  range.setStartAfter(node);
  range.collapse(true);

  selection.removeAllRanges();
  selection.addRange(range);
}


/* Keyboard Buttons */

document
  .querySelectorAll("[data-key]")
  .forEach(button => {

    button.addEventListener("click", () => {

      insertText(
        button.getAttribute("data-key")
      );

    });

  });


/* Special Characters */

document
  .querySelectorAll("[data-char]")
  .forEach(button => {

    button.addEventListener("click", () => {

      insertText(
        button.getAttribute("data-char")
      );

    });

  });


/* Space */

document
  .getElementById("space")
  .addEventListener("click", () => {

    insertText(" ");

  });


/* Enter */

document
  .getElementById("enter")
  .addEventListener("click", () => {

    insertText("\n");

  });


/* Backspace */

document
  .getElementById("backspace")
  .addEventListener("click", () => {

    editor.focus();

    const selection =
      window.getSelection();

    if(!selection.rangeCount) return;

    const range =
      selection.getRangeAt(0);

    if(!range.collapsed){

      range.deleteContents();

      return;
    }

    const node =
      range.startContainer;

    const offset =
      range.startOffset;

    if(
      node.nodeType === Node.TEXT_NODE &&
      offset > 0
    ){

      const newRange =
        document.createRange();

      newRange.setStart(
        node,
        offset - 1
      );

      newRange.setEnd(
        node,
        offset
      );

      newRange.deleteContents();

      selection.removeAllRanges();
      selection.addRange(newRange);

      return;
    }

    if(
      node.nodeType === Node.ELEMENT_NODE &&
      offset > 0
    ){

      const previous =
        node.childNodes[offset - 1];

      if(previous){

        if(
          previous.nodeType === Node.TEXT_NODE
        ){

          previous.textContent =
            previous.textContent.slice(0,-1);

        }else{

          previous.remove();

        }

      }

    }

  });


/* Font Change */

function applyFont(){

  const fontClass =
    fontSelect.value;

  const allFonts = [

    "font-jameel",
    "font-noto",
    "font-calligraphic",
    "font-calligraphy",
    "font-elegant",
    "font-arabic",
    "font-kufi",
    "font-serif",
    "font-sans"

  ];

  allFonts.forEach(cls => {

    editor.classList.remove(cls);
    preview.classList.remove(cls);

  });

  editor.classList.add(fontClass);
  preview.classList.add(fontClass);

}


fontSelect.addEventListener(
  "change",
  applyFont
);


/* Font Size */

fontSize.addEventListener(
  "input",
  () => {

    let size =
      parseInt(fontSize.value,10);

    if(isNaN(size)){
      size = 26;
    }

    size =
      Math.max(16,Math.min(60,size));

    editor.style.fontSize =
      size + "px";

    preview.style.fontSize =
      Math.max(22,size) + "px";

  }
);


/* Text Color */

textColor.addEventListener(
  "input",
  () => {

    editor.style.color =
      textColor.value;

    preview.style.color =
      textColor.value;

  }
);


/* Reset Color */

resetColor.addEventListener(
  "click",
  () => {

    editor.style.color =
      "#173f35";

    preview.style.color =
      "#173f35";

    textColor.value =
      "#173f35";

  }
);


/* Physical Keyboard Enter */

editor.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      insertText("\n");

    }

  }
);


/* Initial Settings */

applyFont();

editor.style.fontSize =
  fontSize.value + "px";

editor.style.color =
  textColor.value;

preview.style.color =
  textColor.value;


/* Service Worker */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register("./service-worker.js")
        .catch(() => {});

    }
  );

}

</script>

</body>
</html>
