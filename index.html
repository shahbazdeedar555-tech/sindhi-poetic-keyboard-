
<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سنڌي شاعري ڪي بورڊ</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#173f35">

<!-- وڌيڪ خوبصورت عربي/سنڌي فونٽ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lateef:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f1e8;
  color:#173f35;
  font-family:Arial,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

h1{
  text-align:center;
  margin:8px 0 18px;
}

h2{
  margin:12px 0;
}

.panel{
  background:#fffaf0;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

label{
  font-weight:bold;
}

select,input[type="number"],input[type="color"]{
  margin:5px;
  padding:7px;
  border:1px solid #c8bda9;
  border-radius:7px;
}

button{
  border:0;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
}

#editor{
  width:100%;
  min-height:230px;
  resize:vertical;
  padding:15px;
  border:2px solid #173f35;
  border-radius:12px;
  background:#fff;
  outline:none;
  line-height:2;
  font-size:28px;
  direction:rtl;
  text-align:right;
}

.special{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin:8px 0;
}

.special button{
  background:#e8dfcd;
  color:#173f35;
  font-size:20px;
}

.keyboard{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
  margin-top:10px;
}

.key{
  min-width:42px;
  min-height:42px;
  padding:7px;
  background:#173f35;
  color:#fff;
  font-size:21px;
  font-family:inherit;
}

.key.special-key{
  background:#b58b35;
}

.key.shift-active{
  background:#8b2f2f;
}

footer{
  text-align:center;
  padding:18px 5px;
  color:#6b604f;
}
</style>
</head>

<body>

<div class="container">

<h1>سنڌي شاعري ڪي بورڊ</h1>

<div class="panel">

<h2>🖋️ فانٽ ۽ ڪلر سليڪشن</h2>

<label>فونٽ:</label>

<select id="fontSelect">

<option value="Jameel Noori Nastaleeq">
Jameel Noori Nastaleeq
</option>

<option value="Noto Nastaliq Urdu">
Noto Nastaliq Urdu
</option>

<option value="Lateef">
Lateef — خوبصورت نستعليق انداز
</option>

<option value="Amiri">
Amiri — عربي ڪليوگرافي
</option>

<option value="Scheherazade New">
Scheherazade New — ادبي انداز
</option>

<option value="Noto Naskh Arabic">
Noto Naskh Arabic
</option>

<option value="Noto Sans Arabic">
Noto Sans Arabic
</option>

<option value="Noto Kufi Arabic">
Noto Kufi Arabic — ڪوفي انداز
</option>

<option value="Traditional Arabic">
Traditional Arabic
</option>

<option value="Georgia">
Georgia — Elegant Serif
</option>

<option value="Arial">
Arial
</option>

</select>

<br>

<label>سائيز:</label>
<input type="number" id="fontSize" value="28" min="12" max="80"> px

<br>

<label>چونڊيل لفظ جو رنگ:</label>
<input type="color" id="fontColor" value="#173f35">
<button id="clearColor">رنگ ختم</button>

<br>

<button id="boldBtn"><b>B</b> بولڊ</button>

</div>

<div class="panel">

<h2>سنڌي شاعري ـ احساسن جي زبان</h2>

<h2>✍️ شاعري لکڻ لاءِ جاءِ</h2>

<p>پنهنجي شاعري هتي لکو ۽ هيٺ ڏنل ڪي بورڊ استعمال ڪريو.</p>

<textarea id="editor" spellcheck="false"></textarea>

<h3>خاص نشانيون</h3>

<div class="special">
<button data-char="ـ">ـ</button>
<button data-char="َ">َ</button>
<button data-char="ِ">ِ</button>
<button data-char="ُ">ُ</button>
<button data-char="ْ">ْ</button>
<button data-char="ّ">ّ</button>
<button data-char="ٰ">ٰ</button>
</div>

<h3>سنڌي ڪي بورڊ</h3>

<div id="keyboard" class="keyboard"></div>

</div>

<footer>
سنڌي شاعري ڪي بورڊ © 2026
</footer>

</div>

<script>

const editor = document.getElementById("editor");
const keyboard = document.getElementById("keyboard");

let shiftActive = false;

/*
  اهم:
  صرف گهربل اکرن ۾ تبديلي:
  پ کي عام اکر طور شامل ڪيو ويو آهي.
  ه کي عام اکر طور رکيو ويو آهي ته:
  ب + ه = بہ
  ت + ه = تہ
  ن + ه = نہ
*/

const normalKeys = [
"آ","ا","ب","ٻ","ڀ","ت","ٿ","ٽ","ٺ","ث",
"ج","ڄ","جھ","چ","ڇ","ح","خ",
"د","ڌ","ڏ","ڊ","ڍ","ذ","ر","ڙ","ز",
"س","ش","ص","ض","ط","ظ","ع","غ",
"ف","ڦ","ق","ڪ","ک","گ","ڳ","گھ",
"ل","م","ن","ڻ","و","ه","ء","ي","ئ","ى","ے","پ",
"ۿ","،","."
];

const shiftMap = {
"ا":"آ",
"ت":"ٿ",
"ٽ":"ٺ",
"ج":"جھ",
"چ":"ڇ",
"د":"ڌ",
"ڊ":"ڍ",
"ر":"ڙ",
"ف":"ڦ",
"گ":"ڳ",
"ن":"ڻ",
"ي":"ئ"
};

function insertText(text){
  const start = editor.selectionStart;
  const end = editor.selectionEnd;

  editor.value =
    editor.value.substring(0,start) +
    text +
    editor.value.substring(end);

  editor.focus();

  const pos = start + text.length;
  editor.selectionStart = pos;
  editor.selectionEnd = pos;
}

function createKeyboard(){

  keyboard.innerHTML="";

  normalKeys.forEach(letter=>{

    const btn=document.createElement("button");
    btn.className="key";

    let shownLetter=letter;

    if(shiftActive && shiftMap[letter]){
      shownLetter=shiftMap[letter];
    }

    btn.textContent=shownLetter;

    btn.onclick=()=>{

      let output=letter;

      if(shiftActive && shiftMap[letter]){
        output=shiftMap[letter];
      }

      insertText(output);

      shiftActive=false;
      createKeyboard();
    };

    keyboard.appendChild(btn);
  });

  // Shift
  const shift=document.createElement("button");
  shift.className="key special-key";

  if(shiftActive){
    shift.classList.add("shift-active");
  }

  shift.textContent="⇧";

  shift.onclick=()=>{
    shiftActive=!shiftActive;
    createKeyboard();
  };

  keyboard.appendChild(shift);

  // Space
  const space=document.createElement("button");
  space.className="key special-key";
  space.textContent="اسپيس";
  space.onclick=()=>insertText(" ");
  keyboard.appendChild(space);

  // Backspace
  const back=document.createElement("button");
  back.className="key special-key";
  back.textContent="⌫";

  back.onclick=()=>{

    const start=editor.selectionStart;
    const end=editor.selectionEnd;

    if(start!==end){
      editor.value=
        editor.value.substring(0,start)+
        editor.value.substring(end);

      editor.selectionStart=start;
      editor.selectionEnd=start;
    }
    else if(start>0){
      editor.value=
        editor.value.substring(0,start-1)+
        editor.value.substring(end);

      editor.selectionStart=start-1;
      editor.selectionEnd=start-1;
    }

    editor.focus();
  };

  keyboard.appendChild(back);

  // Enter
  const enter=document.createElement("button");
  enter.className="key special-key";
  enter.textContent="↵";
  enter.onclick=()=>insertText("\n");
  keyboard.appendChild(enter);

  // Numbers
  const numbers=document.createElement("button");
  numbers.className="key special-key";
  numbers.textContent="123";
  numbers.onclick=()=>{
    insertText("1234567890");
  };

  keyboard.appendChild(numbers);
}

createKeyboard();

/* Special signs */

document.querySelectorAll(".special button").forEach(btn=>{
  btn.onclick=()=>{
    insertText(btn.dataset.char);
  };
});

/* Font */

document.getElementById("fontSelect").addEventListener("change",e=>{
  editor.style.fontFamily=e.target.value;
});

/* Font size */

document.getElementById("fontSize").addEventListener("input",e=>{
  editor.style.fontSize=e.target.value+"px";
});

/* Color */

document.getElementById("fontColor").addEventListener("input",e=>{
  editor.style.color=e.target.value;
});

document.getElementById("clearColor").onclick=()=>{
  editor.style.color="#173f35";
  document.getElementById("fontColor").value="#173f35";
};

/* Bold */

document.getElementById("boldBtn").onclick=()=>{
  editor.style.fontWeight =
    editor.style.fontWeight==="bold" ? "normal" : "bold";
};

</script>

</body>
</html>
