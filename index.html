
<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سنڌي شاعري ڪي بورڊ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f1e8;
      color: #263d2b;
      font-family: Arial, "Noto Naskh Arabic", sans-serif;
    }

    .header {
      background: #234d32;
      color: white;
      text-align: center;
      padding: 15px 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .sub {
      text-align: center;
      color: #b08a35;
      font-size: 15px;
      margin-top: 4px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 12px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 2px solid #b08a35;
      border-radius: 12px;
      background: white;
      padding: 15px;
      font-size: 24px;
      line-height: 2;
      color: #222;
      outline: none;
      direction: rtl;
      text-align: right;
    }

    textarea:focus {
      border-color: #234d32;
    }

    .special-title {
      text-align: center;
      font-weight: bold;
      margin: 14px 0 8px;
      color: #234d32;
    }

    .keyboard {
      background: #e8dfcf;
      padding: 10px;
      border-radius: 15px;
      border: 1px solid #c9b993;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    button {
      border: 1px solid #b49a65;
      background: #fffdf8;
      color: #263d2b;
      min-width: 42px;
      height: 46px;
      border-radius: 9px;
      font-size: 23px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 3px rgba(0,0,0,0.08);
    }

    button:active {
      transform: scale(0.95);
      background: #dfe9df;
    }

    .special button {
      min-width: 48px;
      font-size: 22px;
    }

    .letters button {
      min-width: 40px;
    }

    .shift {
      background: #234d32;
      color: white;
      border-color: #234d32;
      min-width: 72px;
      font-size: 18px;
    }

    .shift.active {
      background: #b08a35;
      border-color: #b08a35;
    }

    .space {
      min-width: 145px;
      font-size: 17px;
      direction: ltr;
    }

    .delete {
      min-width: 85px;
      font-size: 17px;
      direction: ltr;
    }

    .clear {
      min-width: 75px;
      font-size: 17px;
      direction: ltr;
    }

    .footer {
      text-align: center;
      margin: 15px 0;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="header">
    سنڌي شاعري ڪي بورڊ
    <div class="sub">Sindhi Poetry Keyboard</div>
  </div>

  <div class="container">

    <textarea
      id="textBox"
      placeholder="هتي سنڌي لکو..."
      spellcheck="false"></textarea>

    <div class="special-title">خاص نشانيون</div>

    <div class="keyboard">

      <!-- Special characters -->
      <div class="row special">
        <button onclick="typeChar('ـ')">ـ</button>
        <button onclick="typeChar('َ')">َ</button>
        <button onclick="typeChar('ِ')">ِ</button>
        <button onclick="typeChar('ُ')">ُ</button>
        <button onclick="typeChar('ْ')">ْ</button>
        <button onclick="typeChar('ّ')">ّ</button>
        <button onclick="typeChar('ٰ')">ٰ</button>
        <button id="shiftBtn" class="shift" onclick="toggleShift()">Shift</button>
      </div>

      <!-- Sindhi letters -->
      <div class="row letters">
        <button onclick="typeChar('ا')">ا</button>
        <button onclick="typeChar('ب')">ب</button>
        <button onclick="typeChar('ٻ')">ٻ</button>
        <button onclick="typeChar('پ')">پ</button>
        <button onclick="typeChar('ڀ')">ڀ</button>
        <button onclick="typeChar('ت')">ت</button>
        <button onclick="typeChar('ٺ')">ٺ</button>
        <button onclick="typeChar('ٽ')">ٽ</button>
        <button onclick="typeChar('ث')">ث</button>
        <button onclick="typeChar('ٿ')">ٿ</button>
        <button onclick="typeChar('ف')">ف</button>
        <button onclick="typeChar('ڦ')">ڦ</button>
        <button onclick="typeChar('گ')">گ</button>
        <button onclick="typeChar('ڳ')">ڳ</button>
        <button onclick="typeChar('ڱ')">ڱ</button>
        <button onclick="typeChar('ک')">ک</button>
        <button onclick="typeChar('ي')">ي</button>
        <button onclick="typeChar('د')">د</button>
      </div>

      <div class="row letters">
        <button onclick="typeChar('ر')">ر</button>
        <button onclick="typeChar('ڙ')">ڙ</button>
        <button onclick="typeChar('ز')">ز</button>
        <button onclick="typeChar('س')">س</button>
        <button onclick="typeChar('ش')">ش</button>
        <button onclick="typeChar('ص')">ص</button>
        <button onclick="typeChar('ض')">ض</button>
        <button onclick="typeChar('ط')">ط</button>
        <button onclick="typeChar('ظ')">ظ</button>
        <button onclick="typeChar('ع')">ع</button>
        <button onclick="typeChar('غ')">غ</button>
        <button onclick="typeChar('ق')">ق</button>
        <button onclick="typeChar('ڪ')">ڪ</button>
        <button onclick="typeChar('ل')">ل</button>
        <button onclick="typeChar('م')">م</button>
        <button onclick="typeChar('ن')">ن</button>
        <button onclick="typeChar('و')">و</button>
        <button onclick="typeChar('ه')">ه</button>
        <button onclick="typeChar('ء')">ء</button>
        <button onclick="typeChar('ي')">ي</button>
      </div>

      <!-- Space, Delete, Clear -->
      <div class="row">
        <button class="space" onclick="typeChar(' ')">Space</button>
        <button class="delete" onclick="deleteChar()">Delete</button>
        <button class="clear" onclick="clearText()">Clear</button>
      </div>

    </div>

    <div class="footer">
      سنڌي شاعري لاءِ تيار ڪيل ڪي بورڊ
    </div>

  </div>

  <script>
    const textBox = document.getElementById("textBox");
    const shiftBtn = document.getElementById("shiftBtn");

    let shiftOn = false;

    function typeChar(char) {
      let value = textBox.value;
      let start = textBox.selectionStart;
      let end = textBox.selectionEnd;

      /*
        Shift ON:
        ب = بہ
        ت = تہ

        باقي اکر عام طرح لکبا.
      */
      if (shiftOn) {
        if (char === "ب") {
          char = "بہ";
        } else if (char === "ت") {
          char = "تہ";
        }

        shiftOn = false;
        shiftBtn.classList.remove("active");
      }

      textBox.value =
        value.substring(0, start) +
        char +
        value.substring(end);

      textBox.focus();

      const newPosition = start + char.length;
      textBox.setSelectionRange(newPosition, newPosition);
    }

    function toggleShift() {
      shiftOn = !shiftOn;

      if (shiftOn) {
        shiftBtn.classList.add("active");
      } else {
        shiftBtn.classList.remove("active");
      }

      textBox.focus();
    }

    function deleteChar() {
      let start = textBox.selectionStart;
      let end = textBox.selectionEnd;
      let value = textBox.value;

      if (start !== end) {
        textBox.value =
          value.substring(0, start) +
          value.substring(end);

        textBox.setSelectionRange(start, start);
      } else if (start > 0) {
        textBox.value =
          value.substring(0, start - 1) +
          value.substring(start);

        textBox.setSelectionRange(start - 1, start - 1);
      }

      textBox.focus();
    }

    function clearText() {
      textBox.value = "";
      textBox.focus();
      shiftOn = false;
      shiftBtn.classList.remove("active");
    }

    /*
      موبائل تي Enter سان textarea ۾ نئين سٽ اڳ ئي ڪم ڪندي.
      عام keyboard مان به سنڌي لکڻ جي اجازت آهي.
    */
  </script>

</body>
</html>
