
<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سنڌي شاعري ڪي بورڊ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f1e8;
  color:#173f35;
  font-family:Arial,sans-serif;
}

header{
  background:#173f35;
  color:#f5d27a;
  text-align:center;
  padding:15px 8px;
  border-bottom:4px solid #c49a45;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  color:#fff;
  font-size:14px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.panel{
  background:#fffdf8;
  border:1px solid #d8c69d;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.panel h2{
  margin:0 0 10px;
  color:#173f35;
  font-size:19px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.control-box{
  background:#f5f1e8;
  padding:9px;
  border-radius:10px;
}

.control-box label{
  display:block;
  font-weight:bold;
  margin-bottom:5px;
}

select,
input[type="number"]{
  width:100%;
  padding:8px;
  border:1px solid #c9b98f;
  border-radius:8px;
  background:white;
  font-size:16px;
}

.color-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

input[type="color"]{
  width:55px;
  height:40px;
  padding:2px;
  border:1px solid #aaa;
  border-radius:8px;
  background:white;
}

.reset-color{
  background:#173f35;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-size:14px;
}

/* WRITING AREA */

#writingArea{
  width:100%;
  min-height:220px;
  padding:15px;
  background:#fff;
  border:2px solid #c49a45;
  border-radius:12px;
  outline:none;
  direction:rtl;
  text-align:right;
  font-family:"Jameel Noori Nastaleeq",
               "Noto Nastaliq Urdu",
               Arial,
               sans-serif;
  font-size:26px;
  line-height:2;
  white-space:pre-wrap;
  overflow-wrap:break-word;
}

#writingArea:empty:before{
  content:attr(data-placeholder);
  color:#aaa;
  pointer-events:none;
}

#writingArea:focus{
  border-color:#173f35;
}

/* SPECIAL SYMBOLS */

.section-title{
  text-align:center;
  font-weight:bold;
  margin-bottom:8px;
}

.special-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
}

.special-btn{
  min-width:45px;
  padding:9px 12px;
  background:#173f35;
  color:#fff;
  border-radius:8px;
  font-size:21px;
}

/* KEYBOARD */

.keyboard{
  background:#d9c9a4;
  padding:8px 5px;
  border-radius:14px;
  border:2px solid #b99b5a;
}

.key-row{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:5px;
  margin-bottom:5px;
}

.key{
  min-height:48px;
  background:#fffdf8;
  color:#173f35;
  border:1px solid #bda978;
  border-radius:8px;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 2px 2px rgba(0,0,0,.12);
  padding:3px;
}

.key:active{
  transform:scale(.96);
  background:#ead7a3;
}

.bottom-key-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:5px;
}

.action-key{
  background:#173f35;
  color:#fff;
  min-height:48px;
  border-radius:8px;
  font-size:18px;
  font-weight:bold;
}

.shift-active{
  background:#c49a45 !important;
  color:#173f35 !important;
}

.space-row{
  display:grid;
  grid-template-columns:80px 1fr 80px;
  gap:5px;
  margin-top:5px;
}

.space-key{
  background:#fffdf8;
  border:1px solid #bda978;
  border-radius:8px;
  min-height:48px;
  font-size:17px;
  font-weight:bold;
  color:#173f35;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.main-action{
  padding:12px 5px;
  border-radius:9px;
  background:#173f35;
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

.main-action.clear{
  background:#8d3c32;
}

.main-action.send{
  background:#8a6a25;
}

footer{
  text-align:center;
  padding:15px 5px;
  color:#173f35;
  font-size:13px;
}

@media(max-width:600px){

  header h1{
    font-size:22px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  #writingArea{
    min-height:200px;
    font-size:26px;
  }

  .key-row{
    gap:3px;
  }

  .key{
    min-height:45px;
    font-size:19px;
  }

  .bottom-key-row{
    gap:3px;
  }

  .space-row{
    grid-template-columns:55px 1fr 55px;
  }

  .space-key{
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>
  <h1>سنڌي شاعري ڪي بورڊ</h1>
  <p>سنڌي شاعري لاءِ خوبصورت موبائيل ڪي بورڊ</p>
</header>

<div class="container">

  <!-- FONT & COLOR -->
  <div class="panel">

    <h2>🖋️ فانٽ ۽ ڪلر سليڪشن</h2>

    <div class="controls">

      <div class="control-box">

        <label>فانٽ:</label>

        <select id="fontSelect">

          <option value="Jameel Noori Nastaleeq">
            Jameel Noori Nastaleeq

            Noto Nastaliq Urdu

            Arial
          </option>

        </select>

      </div>


      <div class="control-box">

        <label>سائيز:</label>

        <div style="display:flex;align-items:center;gap:5px;">

          <input
            type="number"

          >

            type="button"

          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- WRITING -->
  <div class="panel">

    <div
      id="writingArea"
      contenteditable="true"
      spellcheck="false"
      data-placeholder="هتي شاعري لکو..."

  </div>


  <!-- SPECIAL SYMBOLS -->
  <div class="panel">

    <div class="section-title">
      خاص نشانيون
    </div>

    <div class="special-row">

      <button class="special-btn" data-special="ـ">ـ</button>
      <button class="special-btn" data-special="َ">َ</button>
      <button class="special-btn" data-special="ِ">ِ</button>
      <button class="special-btn" data-special="ُ">ُ</button>
      <button class="special-btn" data-special="ْ">ْ</button>
      <button class="special-btn" data-special="ّ">ّ</button>
      <button class="special-btn" data-special="ٰ">ٰ</button>

  <!-- KEYBOARD -->
  <div class="panel">

    <div class="keyboard">

      <!-- ROW 1 -->
      <div class="key-row">

        <button class="key" data-char="ا" data-shift="آ">ا</button>

        <button class="key" data-char="ٺ" data-shift="ٿ">ٺ</button>

      </div>


      <!-- ROW 2 -->
      <div class="key-row">

        <button class="key" data-char="ف" data-shift="ڦ">ف</button>

        <button class="key" data-char="ڦ" data-shift="ف">ڦ</button>

        <button class="key" data-char="گ" data-shift="ڳ">گ</button>

        <button class="key" data-char="ڳ" data-shift="ڱ">ڳ</button>

        <button class="key" data-char="ڱ" data-shift="گ">ڱ</button>

        <button class="key" data-char="ک" data-shift="خ">ک</button>

        <button class="key" data-char="خ" data-shift="ک">خ</button>

        <button class="key" data-char="ي" data-shift="ى">ي</button>

        <button class="key" data-char="ى" data-shift="ي">ى</button>

        <button class="key" data-char="د" data-shift="ڊ">د</button>

      </div>


      <!-- ROW 3 -->
      <div class="key-row">

        <button class="key" data-char="ڊ" data-shift="ڍ">ڊ</button>

        <button class="key" data-char="ڍ" data-shift="ڌ">ڍ</button>

        <button class="key" data-char="ڌ" data-shift="ڏ">ڌ</button>

        <button class="key" data-char="ڏ" data-shift="ذ">ڏ</button>

        <button class="key" data-char="ذ" data-shift="ز">ذ</button>

        <button class="key" data-char="ر" data-shift="ڙ">ر</button>

        <button class="key" data-char="ڙ" data-shift="ز">ڙ</button>

        <button class="key" data-char="ز" data-shift="ژ">ز</button>

        <button class="key" data-char="س" data-shift="ش">س</button>

        <button class="key" data-char="ش" data-shift="ص">ش</button>

      <!-- ROW 4 -->
      <div class="key-row">

        <button class="key" data-char="ص" data-shift="ض">ص</button>

        <button class="key" data-char="ض" data-shift="ط">ض</button>

        <button class="key" data-char="ط" data-shift="ظ">ط</button>

        <button class="key" data-char="ظ" data-shift="ع">ظ</button>

        <button class="key" data-char="ع" data-shift="غ">ع</button>

        <button class="key" data-char="غ" data-shift="ق">غ</button>

          class="key"

        <button
          class="key"
          data-char="ئ"
          data-shift="ؤ"
        >
          ئ
        </button>

        <button
          class="key"
          data-char="ؤ"

        >
          ؤ
        </button>

        <button
          class="action-key"

        </button>

<script>

/* =========================================
   WRITING AREA
========================================= */

const writingArea =
  document.getElementById("writingArea");

let savedRange = null;
let shiftActive = false;


/* =========================================
   SAVE SELECTION
========================================= */

function saveSelection(){

  const selection =
    window.getSelection();

  if(!selection || selection.rangeCount === 0){
    return;
  }

  const range =
    selection.getRangeAt(0);

  if(writingArea.contains(range.commonAncestorContainer)){
    savedRange = range.cloneRange();
  }
}


/* =========================================
   RESTORE SELECTION
========================================= */

function restoreSelection(){

  if(!savedRange){

    writingArea.focus();

    return false;
  }

  const selection =
    window.getSelection();

  selection.removeAllRanges();

  selection.addRange(savedRange);

  writingArea.focus();

  return true;
}


/* =========================================
   SELECTION EVENTS
========================================= */

document.addEventListener(
  "selectionchange",
  saveSelection
);

["mouseup","keyup","touchend"].forEach(
  eventName => {

    writingArea.addEventListener(
      eventName,
      saveSelection
    );

  }
);


/* =========================================
   INSERT TEXT
========================================= */

function insertText(text){

  restoreSelection();

  const selection =
    window.getSelection();

  if(!selection){
    return;
  }

  if(selection.rangeCount === 0){

    const range =
      document.createRange();

    range.selectNodeContents(writingArea);

    range.collapse(false);

    selection.addRange(range);
  }

  document.execCommand(
    "insertText",
    false,
    text
  );

  saveSelection();
}


/* =========================================
   KEYBOARD LETTERS
========================================= */

document.querySelectorAll(
  ".key[data-char]"
).forEach(button => {

  button.addEventListener(
    "mousedown",
    function(e){
      e.preventDefault();
    }
  );

  button.addEventListener(
    "click",
    function(){

      let char =
        this.dataset.char;

      if(shiftActive){

        char =
          this.dataset.shift ||
          char;

        shiftActive = false;

        document
          .getElementById("shiftBtn")
          .classList.remove("shift-active");
      }

      insertText(char);

    }
  );

});


/* =========================================
   SPECIAL SYMBOLS
========================================= */

document.querySelectorAll(
  "[data-special]"
).forEach(button => {

  button.addEventListener(
    "mousedown",
    function(e){
      e.preventDefault();
    }
  );

  button.addEventListener(
    "click",
    function(){

      insertText(
        this.dataset.special
      );

    }
  );

});


/* =========================================
   SHIFT
========================================= */

document
  .getElementById("shiftBtn")
  .addEventListener(
    "mousedown",
    function(e){
      e.preventDefault();
    }
  );

document
  .getElementById("shiftBtn")
  .addEventListener(
    "click",
    function(){

      shiftActive =
        !shiftActive;

      this.classList.toggle(
        "shift-active",
        shiftActive
      );

    }
  );


/* =========================================
   SPACE
========================================= */

document
  .getElementById("spaceBtn")
  .addEventListener(
    "mousedown",
    function(e){
      e.preventDefault();
    }
  );

document
  .getElementById("spaceBtn")
  .addEventListener(
    "click",
    function(){

      insertText(" ");

    }
  );


/* =========================================
   ENTER
========================================= */

document
  .getElementById("enterBtn")
  .addEventListener(
    "mousedown",
    function(e){
      e.preventDefault();
    }
  );

document
  .getElementById("enterBtn")
  .addEventListener(
    "click",
    function(){

      restoreSelection();

      document.execCommand(
        "insertLineBreak",
        false,
        null
      );

      saveSelection();

    }
  );


/* =========================================
   BACKSPACE
========================================= */

document
  .getElementById("backspaceBtn")
  .addEventListener(
    "mousedown",
    function(e){
      e.preventDefault();
    }
  );

document
  .getElementById("backspaceBtn")
  .addEventListener(
    "click",
    function(){

      restoreSelection();

      document.execCommand(
        "delete",
        false,
        null
      );

      saveSelection();

    }
  );


/* =========================================
   FONT
========================================= */

const fontSelect =
  document.getElementById("fontSelect");

fontSelect.addEventListener(
  "change",
  function(){

    writingArea.style.fontFamily =
      this.value;

  }
);


/* =========================================
   FONT SIZE
========================================= */

const fontSize =
  document.getElementById("fontSize");

fontSize.addEventListener(
  "input",
  function(){

    writingArea.style.fontSize =
      this.value + "px";

  }
);


/* =========================================
   COLOR — SELECTED WORD ONLY
========================================= */

const textColor =
  document.getElementById("textColor");


function applyColor(color){

  if(!savedRange){

    alert(
      "پهريان لفظ سليڪٽ ڪريو، پوءِ رنگ چونڊيو."
    );

    return;
  }

  restoreSelection();

  const selection =
    window.getSelection();

  if(!selection || selection.rangeCount === 0){

    alert(
      "پهريان لفظ سليڪٽ ڪريو."
    );

    return;
  }

  const range =
    selection.getRangeAt(0);

  if(range.collapsed){

    alert(
      "پهريان لفظ سليڪٽ ڪريو، پوءِ رنگ چونڊيو."
    );

    return;
  }

  document.execCommand(
    "styleWithCSS",
    false,
    true
  );

  document.execCommand(
    "foreColor",
    false,
    color
  );

  saveSelection();

}


/* COLOR PICKER */

textColor.addEventListener(
  "input",
  function(){

    applyColor(this.value);

  }
);


/* =========================================
   RESET COLOR
========================================= */

document
  .getElementById("resetColor")
  .addEventListener(
    "mousedown",
    function(e){
      e.preventDefault();
    }
  );

document
  .getElementById("resetColor")
  .addEventListener(
    "click",
    function(){

      applyColor("#173f35");

    }
  );


/* =========================================
   BOLD — SELECTED WORD ONLY
========================================= */

document
  .getElementById("boldBtn")
  .addEventListener(
    "mousedown",
    function(e){
      e.preventDefault();
    }
  );

document
  .getElementById("boldBtn")
  .addEventListener(
    "click",
    function(){

      if(!savedRange){

        alert(
          "پهريان لفظ سليڪٽ ڪريو، پوءِ بولڊ تي ڪلڪ ڪريو."
        );

        return;
      }

      restoreSelection();

      const selection =
        window.getSelection();

      if(!selection || selection.rangeCount === 0){

        alert(
          "پهريان لفظ سليڪٽ ڪريو."
        );

        return;
      }

      const range =
        selection.getRangeAt(0);

      if(range.collapsed){

        alert(
          "پهريان لفظ سليڪٽ ڪريو، پوءِ بولڊ تي ڪلڪ ڪريو."
        );

        return;
      }

      document.execCommand(
        "styleWithCSS",
        false,
        true
      );

      document.execCommand(
        "bold",
        false,
        null
      );

      saveSelection();

    }
  );


/* =========================================
   COPY
========================================= */

document
  .getElementById("copyBtn")
  .addEventListener(
    "click",
    async function(){

      const text =
        writingArea.innerText;

      if(!text.trim()){

        alert(
          "پهرين شاعري لکو."
        );

        return;
      }

      try{

        await navigator.clipboard.writeText(
          text
        );

        alert(
          "شاعري ڪاپي ٿي وئي."
        );

      }catch(error){

        const temp =
          document.createElement("textarea");

        temp.value = text;

        document.body.appendChild(temp);

        temp.select();

        document.execCommand("copy");

        temp.remove();

        alert(
          "شاعري ڪاپي ٿي وئي."
        );

      }

    }
  );


/* =========================================
   SEND
========================================= */

document
  .getElementById("sendBtn")
  .addEventListener(
    "click",
    async function(){

      const text =
        writingArea.innerText.trim();

      if(!text){

        alert(
          "پهرين شاعري لکو."
        );

        return;
      }

      if(navigator.share){

        try{

          await navigator.share({

            title:"سنڌي شاعري",

            text:text

          });

        }catch(error){

          /* Share cancel ٿيو */

        }

      }else{

        try{

          await navigator.clipboard.writeText(
            text
          );

          alert(
            "Share موجود ناهي، شاعري ڪاپي ٿي وئي."
          );

        }catch(error){

          alert(
            "Send سهولت هن برائوزر ۾ موجود ناهي."
          );

        }

      }

    }
  );


/* =========================================
   CLEAR
========================================= */

document
  .getElementById("clearBtn")
  .addEventListener(
    "click",
    function(){

      if(
        confirm(
          "ڇا توهان سڄي لکيل شاعري صاف ڪرڻ چاهيو ٿا؟"
        )
      ){

        writingArea.innerHTML = "";

        savedRange = null;

        writingArea.focus();

      }

    }
  );


/* =========================================
   DEFAULT FONT
========================================= */

writingArea.style.fontFamily =
  fontSelect.value;

writingArea.style.fontSize =
  fontSize.value + "px";


/* =========================================
   MOBILE LONG-PRESS MENU
========================================= */

document.addEventListener(
  "gesturestart",
  function(e){

    e.preventDefault();

  }
);

</script>
